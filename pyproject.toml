[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "e-bike-compliance-checker"
version = "0.1.1"
description = "电动自行车合规核查工作台（GB 17761—2024 双版本规则集 · 整车/蓄电池/充电器三维限值矩阵 · 批量对账 · 证据指纹）"
readme = "README.md"
requires-python = ">=3.12"
# PEP 639：SPDX 表达式字符串（TOML 表写法已被 setuptools 弃用，硬期限 2027-02-18）
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = ["compliance", "gb-standards", "electric-bicycle", "ruleset", "offline"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6", "pillow>=10"]
report = []
gui = [
  "PySide6>=6.12,<7",
]
build = ["pyinstaller>=6.22,<7", "setuptools<81"]

[project.scripts]
ebikecheck = "ebikecheck.cli:main"

[project.urls]
Homepage = "https://github.com/yuluo554/e-bike-compliance-checker"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

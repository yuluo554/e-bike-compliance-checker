name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 旧解释器只在 Windows 守（Ubuntu 新镜像对 3.8 支持存疑，见 plan/06 D-24）。
          - os: windows-latest
            python: "3.8"
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 脱敏审计的历史扫描依赖全量 git 历史；浅克隆会静默削弱成空验。
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Zero-literals gate
        run: python tools/check_zero_literals.py

      - name: Zero-literals gate selftest
        run: python tools/check_zero_literals.py --selftest

      - name: Ruleset frozen check
        run: python tools/gen_rulesets.py --check

      - name: Synthetic truth frozen check
        run: python tools/gen_synthetic.py --check

      - name: Desensitize audit
        run: python tools/audit_desensitize.py --selftest

      - name: CLI smoke
        run: |
          python -m ebikecheck selfcheck
          python -m ebikecheck bench
